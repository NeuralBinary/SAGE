version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development
    open-pull-requests-limit: 6

  - package-ecosystem: npm
    directory: "/integrations/openclaw"
    schedule:
      interval: weekly
      day: monday
    groups:
      openclaw-adapter:
        patterns:
          - "*"
    open-pull-requests-limit: 4

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 4
