name: Bug report
description: Report a reproducible defect in SAGE.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use the private security advisory form.
  - type: input
    id: version
    attributes:
      label: SAGE version
      placeholder: 0.2.7
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python/runtime, database, operating system, and deployment mode. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest commands, request, or code needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Add sanitized logs, tracebacks, or sage-doctor output.
