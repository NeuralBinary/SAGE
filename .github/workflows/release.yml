name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build and qualify OpenClaw adapter
        working-directory: integrations/openclaw
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build
          npm run tck

      - name: Install and qualify Python source
        run: |
          python -m pip install -e '.[dev,mcp,bench,otel]'
          python -m compileall -q src tests scripts
          pytest -q
          rm -rf .pytest_cache .ruff_cache .mypy_cache build src/*.egg-info integrations/openclaw/node_modules integrations/openclaw/package-lock.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python scripts/release_check.py
          PYTHONPATH=src python scripts/generate_specs.py --check
          PYTHONPATH=src python scripts/generate_protocol_artifacts.py --check

      - name: Build every release asset
        env:
          SOURCE_DATE_EPOCH: "1785456000"
        run: |
          python -m pip install setuptools wheel
          python scripts/build_release.py --output dist

      - name: Verify packaged assets
        run: |
          python scripts/package_check.py \
            --source dist/sage-plugin-v0.2.5.zip \
            --wheel dist/sage_agent_protocol-0.2.5-py3-none-any.whl \
            --hermes dist/sage-hermes-plugin-v0.2.5.zip \
            --openclaw dist/sage-agent-openclaw-sage-0.2.5.tgz
          node scripts/openclaw_adapter_check.mjs

      - name: Test the installed wheel
        run: |
          python -m venv /tmp/sage-release-venv
          /tmp/sage-release-venv/bin/python -m pip install dist/sage_agent_protocol-0.2.5-py3-none-any.whl
          /tmp/sage-release-venv/bin/sage-doctor --help
          /tmp/sage-release-venv/bin/sage-demo --help

      - name: Test local Docker quick start
        run: |
          docker compose -f docker-compose.quickstart.yml up --build -d --wait
          docker compose -f docker-compose.quickstart.yml exec -T sage sage-doctor --url http://127.0.0.1:8080
          docker compose -f docker-compose.quickstart.yml exec -T sage sage-demo --url http://127.0.0.1:8080 --single-agent
          docker compose -f docker-compose.quickstart.yml down -v

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "SAGE $GITHUB_REF_NAME" \
              --notes-file RELEASE-v0.2.5.md
          fi
