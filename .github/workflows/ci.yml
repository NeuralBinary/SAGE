name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: python scripts/security_check.py
      - run: sage-tck --json
      - run: python -m compileall -q src tests scripts
      - run: pytest -q
      - run: python scripts/performance_check.py --iterations 80
      - run: rm -rf .pytest_cache .ruff_cache .mypy_cache src/*.egg-info src/sage_agent_protocol.egg-info && find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - run: python scripts/release_check.py
      - name: Migration verification
        env:
          SAGE_DATABASE_URL: sqlite:///./ci-migration.db
          SAGE_AUTH_REQUIRED: "false"
        run: |
          PYTHONPATH=src alembic upgrade head
          PYTHONPATH=src alembic check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sage
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage -d sage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SAGE_DATABASE_URL: postgresql+psycopg://sage:ci-only-password@127.0.0.1:5432/sage
      SAGE_AUTH_REQUIRED: "false"
      SAGE_TEST_USE_CONFIGURED_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev,postgres]'
      - run: PYTHONPATH=src alembic upgrade head
      - run: PYTHONPATH=src alembic check
      - run: pytest -q
      - run: sage-qualify --configured-concurrency --workers 8 --messages 20

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[postgres,mcp,bench,otel]'
      - run: python -m pip install 'pip-audit==2.10.1'
      - run: pip-audit --local

  openclaw-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --ignore-scripts
        working-directory: integrations/openclaw
      - run: npm run check
        working-directory: integrations/openclaw
      - run: npm run build
        working-directory: integrations/openclaw
      - run: npm run tck
        working-directory: integrations/openclaw
      - run: node --check integrations/openclaw/dist/index.js
      - run: npm pack --ignore-scripts
        working-directory: integrations/openclaw

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: python -m pip install -e '.[dev,mcp,bench,otel]'
      - run: sage-tck --json
      - run: python scripts/conformance_matrix.py
      - run: python -c "from sage_plugin.mcp_server import build_server; assert build_server() is not None"
      - run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - run: docker build -t sage-agent-protocol:test .
