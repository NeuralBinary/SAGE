name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --ignore-scripts
        working-directory: integrations/openclaw
      - run: npm run build
        working-directory: integrations/openclaw
      - run: ruff check src tests scripts
      - run: python scripts/security_check.py
      - run: python scripts/architecture_check.py
      - run: python scripts/invariant_check.py
      - run: PYTHONPATH=src python scripts/generate_specs.py --check
      - run: PYTHONPATH=src python scripts/generate_protocol_artifacts.py --check
      - run: sage-tck --json
      - run: python scripts/conformance_matrix.py
      - run: python scripts/differential_fuzz.py --iterations 250
      - run: python scripts/chaos_suite.py
      - run: python -m compileall -q src tests scripts
      - run: pytest -q
      - run: python scripts/performance_check.py --iterations 200 --best-of 3
      - run: sage-qualify --profile-encode --profile-iterations 30 --max-query-count 40
      - run: rm -rf .pytest_cache .ruff_cache .mypy_cache src/*.egg-info src/sage_agent_protocol.egg-info && find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - run: rm -rf integrations/openclaw/node_modules integrations/openclaw/package-lock.json
      - run: python scripts/release_check.py
      - name: Migration verification
        env:
          SAGE_DATABASE_URL: sqlite:///./ci-migration.db
          SAGE_AUTH_REQUIRED: "false"
        run: |
          PYTHONPATH=src alembic upgrade head
          PYTHONPATH=src alembic check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sage
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage -d sage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SAGE_DATABASE_URL: postgresql+psycopg://sage:ci-only-password@127.0.0.1:5432/sage
      SAGE_AUTH_REQUIRED: "false"
      SAGE_TEST_USE_CONFIGURED_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev,postgres]'
      - run: PYTHONPATH=src alembic upgrade head
      - run: PYTHONPATH=src alembic check
      - run: pytest -q
      - run: sage-qualify --configured-concurrency --workers 8 --messages 20
      - run: sage-qualify --configured-ordering --workers 8 --messages 20

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[postgres,mcp,bench,otel]'
      - run: python -m pip install 'pip-audit==2.10.1'
      - run: pip-audit --local

  openclaw-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install --ignore-scripts
        working-directory: integrations/openclaw
      - run: npm run check
        working-directory: integrations/openclaw
      - run: npm run build
        working-directory: integrations/openclaw
      - run: npm run tck
        working-directory: integrations/openclaw
      - run: node --check integrations/openclaw/dist/index.js
      - run: node scripts/openclaw_adapter_check.mjs
      - run: npm pack --ignore-scripts
        working-directory: integrations/openclaw
      - run: python ../../scripts/package_check.py --openclaw sage-agent-openclaw-sage-0.2.6.tgz
        working-directory: integrations/openclaw

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: python -m pip install -e '.[dev,mcp,bench,otel]'
      - run: npm install --ignore-scripts
        working-directory: integrations/openclaw
      - run: npm run build
        working-directory: integrations/openclaw
      - run: python -m pip install setuptools wheel
      - run: sage-tck --json
      - run: python scripts/conformance_matrix.py
      - run: python scripts/differential_fuzz.py --iterations 500
      - run: python scripts/architecture_check.py
      - run: python scripts/invariant_check.py
      - run: PYTHONPATH=src python scripts/generate_specs.py --check
      - run: PYTHONPATH=src python scripts/generate_protocol_artifacts.py --check
      - run: python -c "from sage_plugin.mcp_server import build_server; assert build_server() is not None"
      - run: python scripts/build_release.py --output dist --skip-openclaw
      - run: |
          python scripts/package_check.py \
            --source dist/sage-plugin-v0.2.6.zip \
            --wheel dist/sage_agent_protocol-0.2.6-py3-none-any.whl \
            --hermes dist/sage-hermes-plugin-v0.2.6.zip
      - run: docker build -t sage-agent-protocol:test .


  staging-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Generate staging TLS certificate
        run: |
          mkdir -p .ci-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .ci-tls/server.key -out .ci-tls/server.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
      - name: Configure staging environment
        run: |
          echo "SAGE_POSTGRES_PASSWORD=ci-staging-postgres-password" >> "$GITHUB_ENV"
          echo "SAGE_API_KEYS=ci-staging-service-key-0123456789abcdef" >> "$GITHUB_ENV"
          echo "SAGE_ALLOWED_HOSTS=localhost,127.0.0.1,sage-a,sage-b,sage-c" >> "$GITHUB_ENV"
          echo "SAGE_TLS_CERT=${GITHUB_WORKSPACE}/.ci-tls/server.crt" >> "$GITHUB_ENV"
          echo "SAGE_TLS_KEY=${GITHUB_WORKSPACE}/.ci-tls/server.key" >> "$GITHUB_ENV"
      - name: Validate staging topology
        run: docker compose -f deploy/staging/compose.yml config --quiet
      - name: Start staging cluster
        run: docker compose -f deploy/staging/compose.yml up --build -d --wait
      - name: Qualify TLS load-balanced delivery
        run: |
          python scripts/soak_cluster.py \
            --url https://localhost:8443 \
            --api-key "$SAGE_API_KEYS" \
            --workspace ci-staging \
            --duration-seconds 10 \
            --workers 8 \
            --rate 8 \
            --ca-cert .ci-tls/server.crt
      - name: Qualify worker and database recovery
        run: |
          python scripts/cluster_chaos.py \
            --url https://localhost:8443 \
            --api-key "$SAGE_API_KEYS" \
            --workspace ci-chaos \
            --compose-file deploy/staging/compose.yml \
            --ca-cert .ci-tls/server.crt \
            --disrupt-postgres
      - name: Stop staging cluster
        if: always()
        run: |
          docker compose -f deploy/staging/compose.yml logs --no-color postgres migrate sage-a sage-b sage-c gateway || true
          docker compose -f deploy/staging/compose.yml down -v --remove-orphans
